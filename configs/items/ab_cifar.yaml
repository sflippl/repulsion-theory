# @package _global_.items
#
# CIFAR-100 A-B pairs (ResNet-18 avgpool embeddings, one image per item), two
# groups of two pairs. A: different categories within a group. B: same image within a group, same category across groups.
# A and B never share a category or an image.

items:
  - name: A
    stimulus_type: image
    source: {dataset: cifar100, split: train, model: resnet18, weights: DEFAULT, layer: avgpool}
    n_groups: 2
    n_items: 2
    within_group: different_category
    across_groups: different_category
  - name: B
    stimulus_type: image
    source: {dataset: cifar100, split: train, model: resnet18, weights: DEFAULT, layer: avgpool}
    n_groups: 2
    n_items: 2
    within_group: same_image
    across_groups: same_category
