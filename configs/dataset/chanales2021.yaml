# @package _global_.dataset

slots:
  input:
    color: color
    face: face
    object: object
  output:
    color: color
    face: face
    object: object
tasks:
  - name: autoencoding
    input:
      color:
        magnitude: 1.0
        noise_std: 0.05
      face:
        magnitude: 1.0
      object:
        magnitude: 0.2
    output:
      color:
        magnitude: 1.0
        noise_std: 0.05
      face:
        magnitude: 1.0
      object:
        magnitude: 0.2
  - name: association_group
    input:
      face:
        magnitude: 1.0
        manipulation: group
    output:
      face:
        magnitude: 1.0
        manipulation: group
  - name: prediction_evaluation
    input:
      face:
        magnitude: 1.0
      object:
        magnitude: 0.2
    output:
      color:
        magnitude: 1.0
  - name: prediction_test
    input:
      face:
        magnitude: 1.0
      object:
        magnitude: 0.2
    output:
      face:
        magnitude: 1.0
      object:
        magnitude: 0.2
