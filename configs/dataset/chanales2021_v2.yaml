# @package _global_.dataset

slots:
  input:
    color: color
    face_shared: face_shared
    face_unique: face_unique
    object: object
  output:
    color: color
    face_shared: face_shared
    face_unique: face_unique
    object: object
    face2_shared: face_shared
    face2_unique: face_unique
tasks:
  - name: autoencoding
    input:
      color:
        magnitude: 1.0
        noise_std: 0.
      face_shared:
        magnitude: 1.0
      face_unique:
        magnitude: 1.0
      object:
        magnitude: 1.0
    output:
      color:
        magnitude: 1.0
        noise_std: 0.
      face_shared:
        magnitude: 1.0
      face_unique:
        magnitude: 1.0
      object:
        magnitude: 1.0
  - name: association
    input:
      color:
        magnitude: 1.0
        noise_std: 0.
      object:
        magnitude: 1.0
    output:
      face2_shared:
        magnitude: 1.0
      face2_unique:
        magnitude: 1.0
  - name: association_group
    input:
      face_shared:
        magnitude: 1.0
      face_unique:
        magnitude: 1.0
    output:
      face2_shared:
        magnitude: 1.0
        manipulation: group
      face2_unique:
        magnitude: 1.0
        manipulation: group
  - name: prediction_evaluation
    input:
      face_shared:
        magnitude: 1.0
      face_unique:
        magnitude: 1.0
      object:
        magnitude: 1.0
    output:
      color:
        magnitude: 1.0
  - name: prediction_test
    input:
      face_shared:
        magnitude: 1.0
      face_unique:
        magnitude: 1.0
      object:
        magnitude: 1.0
    output:
      face_shared:
        magnitude: 1.0
      face_unique:
        magnitude: 1.0
      object:
        magnitude: 1.0
