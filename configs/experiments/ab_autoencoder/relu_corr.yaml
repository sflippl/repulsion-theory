# @package _global_
#
# Full-batch autoencoding of A-B pairs: ReLU network, sampled vectors, corr(A) = 0.5 within and across groups, B1 = B2.
# Plain gradient descent, learning rate scaled to the input norm
# (sampled vectors: unit norm; CIFAR features: ~26 per slot).
defaults:
  - override /model: relu_small_init
  - override /dataset: ab_autoencoding
  - override /schedule: ab_fullbatch
  - override /items: ab_corr
  - override /evaluation: ab_autoencoding

training:
  lr: 0.02
  momentum: 0.0
