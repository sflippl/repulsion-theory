# @package _global_
#
# Full-batch prediction of B from A: linear network, CIFAR-100, A: different categories within and across groups, B: same image within group, same category across groups.
# Plain gradient descent, learning rate scaled to the input norm
# (sampled vectors: unit norm; CIFAR features: ~26 per slot).
defaults:
  - override /model: linear_small_init
  - override /dataset: ab_prediction
  - override /schedule: ab_prediction_fullbatch
  - override /items: ab_cifar
  - override /evaluation: ab_prediction

training:
  lr: 2.0e-4
  momentum: 0.0
