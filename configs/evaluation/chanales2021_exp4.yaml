# @package _global_.evaluation
#
# As evaluation/chanales2021, plus the face-group association loss.
#
# (Lists replace rather than merge in Hydra, so the full list is repeated.)

evaluations:
  - name: row_loss_autoencoding
    task: autoencoding
    save: row_loss
    eval_every_steps: 8

  - name: row_loss_prediction_test
    task: prediction_test
    save: row_loss
    eval_every_steps: 8

  - name: row_loss_association
    task: association_group
    save: row_loss
    eval_every_steps: 8

  - name: prediction
    task: prediction_evaluation
    save: output
    eval_every_steps: 8

  - name: loss_autoencoding
    task: autoencoding
    save: loss
    eval_every_steps: 8

  - name: loss_prediction_test
    task: prediction_test
    save: loss
    eval_every_steps: 8

  - name: loss_association
    task: association_group
    save: loss
    eval_every_steps: 8
