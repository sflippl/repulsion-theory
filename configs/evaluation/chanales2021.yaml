# @package _global_.evaluation
#
# Evaluated every 8 steps (8 cycles × 3 tasks × 48 rows = 1152 steps).
#   row_loss_autoencoding     color-object-face autoencoding, per-row loss
#   row_loss_prediction_test  object-face autoencoding, per-row loss
#   prediction                color read out from object + face (color error,
#                             response away from competitor)
#   loss_*                    aggregate per-slot losses

evaluations:
  - name: row_loss_autoencoding
    task: autoencoding
    save: row_loss
    eval_every_steps: 8

  - name: row_loss_prediction_test
    task: prediction_test
    save: row_loss
    eval_every_steps: 8

  - name: prediction
    task: prediction_evaluation
    save: output
    eval_every_steps: 8

  - name: loss_autoencoding
    task: autoencoding
    save: loss
    eval_every_steps: 8

  - name: loss_prediction_test
    task: prediction_test
    save: loss
    eval_every_steps: 8
