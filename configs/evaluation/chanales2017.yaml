# @package _global_.evaluation
#
# Logged at geometrically-spaced steps (factor 1.01):
#   representations   hidden representations of every stream (pairmate vs.
#                     non-pairmate similarity)
#   output            route read-out (accuracy vs. the pairmate route)
#   loss_prediction   aggregate per-slot autoencoding loss
#
# Use eval_every_steps: N instead of eval_every_log_steps for fixed intervals.

evaluations:
  - name: representations
    task: autoencoding
    save: representation
    eval_every_log_steps: 1.01

  - name: output
    task: autoencoding
    save: output
    eval_every_log_steps: 1.01

  - name: loss_prediction
    task: autoencoding
    save: loss
    eval_every_log_steps: 1.01
